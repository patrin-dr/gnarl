name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.0.7
    strategy:
      fail-fast: false
      matrix:
        project: [gnarl, blink, regtest, oledtest, mmtune, pumpstat]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare project
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make clean
          make ${{ matrix.project }}

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd project
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project }}-firmware
          path: |
            project/build/*.bin
            project/build/bootloader/bootloader.bin
            project/build/partition_table/partition-table.bin
            project/build/flash_args

  # Push a tag like v0.2.0 to publish a GitHub Release with all firmware.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Package
        shell: bash
        run: |
          cd dist
          for d in */; do
            name="${d%/}"
            printf '%s\n' \
              "Flash with: python3 -m pip install esptool" \
              "python3 -m esptool --chip esp32 -p <port> -b 460800 write_flash @flash_args" \
              "(run in this directory; port on macOS: ls /dev/cu.*)" > "$name/FLASHING.txt"
            (cd "$name" && zip -qr "../${name}-${GITHUB_REF_NAME}.zip" .)
          done
          ls -l *.zip

      # Works both for a pushed tag (creates the release) and for a release
      # created on github.com with a new tag (attaches the firmware to it).
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "GNARL $GITHUB_REF_NAME" \
              --generate-notes
          fi
