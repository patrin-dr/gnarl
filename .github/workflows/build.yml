name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.0.7
    strategy:
      fail-fast: false
      matrix:
        project: [gnarl, blink, regtest, oledtest, mmtune, pumpstat]
        # heltec_v2: ESP32 with on-board SX1276.
        # heltec_v3_rfm95: ESP32-S3 (Heltec V3.x) with an external RFM95W.
        # lilygo_t3_v161: LilyGO T3 LoRa32 V1.6.1 (ESP32 + SX1276).
        board: [heltec_v2, heltec_v3_rfm95, lilygo_t3_v161]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare project
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make clean
          make ${{ matrix.project }} BOARD=${{ matrix.board }}

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd project
          idf.py build

      - name: Check chip
        shell: bash
        run: |
          case "${{ matrix.board }}" in
            heltec_v3*) want=esp32s3; boot=0x0 ;;
            *)          want=esp32;   boot=0x1000 ;;
          esac
          got=$(sed -n 's/^CONFIG_IDF_TARGET="\(.*\)"/\1/p' project/sdkconfig)
          echo "board ${{ matrix.board }}: target $got"
          head -5 project/build/flash_args
          test "$got" = "$want"
          grep -q "^$boot bootloader/bootloader.bin" project/build/flash_args

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          # Heltec V2 keeps the original names (gnarl-firmware, ...).
          name: ${{ matrix.board == 'heltec_v2' && format('{0}-firmware', matrix.project) || format('{0}-{1}-firmware', matrix.project, matrix.board) }}
          path: |
            project/build/*.bin
            project/build/bootloader/bootloader.bin
            project/build/partition_table/partition-table.bin
            project/build/flash_args

  # Render every screen (Russian and English) on the runner and fail if
  # any text does not fit the 128x64 display. Images are kept as artifact.
  screens:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Render screens
        run: |
          python3 -m pip install --quiet pillow || true
          tools/screen_preview/run.sh ru out/ru
          tools/screen_preview/run.sh en out/en
          # Boards without a user button show different unpair text.
          tools/screen_preview/run.sh ru out/ru_t3 lilygo_t3_v161
          tools/screen_preview/run.sh en out/en_t3 lilygo_t3_v161

      - name: Upload screen images
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screens
          path: out/*/*.png

  # Push a tag like v0.2.0 to publish a GitHub Release with all firmware.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Package
        shell: bash
        run: |
          cd dist
          for d in */; do
            name="${d%/}"
            printf '%s\n' \
              "Flash with: python3 -m pip install esptool" \
              "python3 -m esptool --chip auto -p <port> -b 460800 write_flash @flash_args" \
              "Archives named *-heltec_v3_rfm95-* are for Heltec V3.x + RFM95W," \
              "the others for Heltec V2 / V2.1." \
              "(run in this directory; port on macOS: ls /dev/cu.*)" > "$name/FLASHING.txt"
            (cd "$name" && zip -qr "../${name}-${GITHUB_REF_NAME}.zip" .)
          done
          ls -l *.zip

      # Works both for a pushed tag (creates the release) and for a release
      # created on github.com with a new tag (attaches the firmware to it).
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "GNARL $GITHUB_REF_NAME" \
              --generate-notes
          fi
